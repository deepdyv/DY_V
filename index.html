<!DOCTYPE html>
<html>

<style>
*{margin:0;box-sizing:border-box}body{background:#0e0e12;color:#fff;font-family:Arial;overflow-x:hidden}
.top{display:flex;align-items:center;padding:12px;gap:10px;position:sticky;top:0;background:#0e0e12;z-index:10}
.search{flex:1;background:#1e1e22;border-radius:24px;padding:10px 14px;display:flex;align-items:center;gap:8px;color:#999}
.tabs{display:flex;gap:22px;padding:0 14px 10px;font-size:17px;color:#888} .tabs b{color:#fff;border-bottom:3px solid #ffb700;padding-bottom:4px}
.hero{position:relative;height:420px;margin:10px;border-radius:16px;overflow:hidden;background:url('https://image.tmdb.org/t/p/w780/5YZbUmjbMa3ClvSW1Wj3EljG9zM.jpg');background-size:cover;background-position:center}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#0e0e12 5%, transparent 60%)}
.play{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:2;border:1.5px solid #d6b98a;background:#00000090;padding:10px 50px;border-radius:30px;display:flex;align-items:center;gap:8px;font-weight:bold}
.section{padding:14px 0 0 14px} .head{display:flex;justify-content:space-between;padding-right:14px;font-size:18px;font-weight:bold;margin-bottom:10px}
.hscroll{display:flex;gap:10px;overflow:auto;padding-bottom:10px} .hscroll::-webkit-scrollbar{display:none}
.langCard{min-width:160px;height:70px;border-radius:10px;display:flex;align-items:center;padding:10px;font-weight:900;font-size:20px;position:relative;overflow:hidden}
.langCard.hi{background:#ff9500} .langCard.ta{background:#e6b800} .langCard.te{background:#00b578}
.movieCard{min-width:130px;background:#1a1a1f;border-radius:10px;overflow:hidden;position:relative}
.movieCard img{width:130px;height:180px;object-fit:cover;display:block}
.badge{position:absolute;top:6px;left:6px;background:#000000a0;color:#00d0ff;font-size:11px;padding:2px 6px;border-radius:4px;font-weight:bold}
.title{font-size:13px;padding:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:130px}
.listBtn{margin:6px;border:1px solid #d6b98a;border-radius:20px;padding:5px;text-align:center;font-size:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#141419;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #222}
.bottom div{color:#777;text-align:center;font-size:12px} .bottom b{color:#ffb700;display:block;font-size:20px}
a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div class="top"><div class="search">🔍 after the dark</div><div style="font-size:12px">💰 <b style="color:#ffb700">Earn<br>Money</b></div></div>

<div style="height:80px"></div>
